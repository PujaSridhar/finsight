# 10-minute end-to-end check of the earnings run: tiny data, a few steps.
# python -m finsight.train --config configs/earnings_smoke.yaml
task: earnings
model_id: mistralai/Mistral-7B-Instruct-v0.3
data_dir: data/earnings
output_dir: outputs/earnings-smoke
loss_curve: results/loss_curve_smoke.png
seed: 42
init_adapter: null
max_train_examples: 32
max_val_examples: 8
max_seq_len: 3072
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.0
weight_decay: 0.0
max_grad_norm: 0.3
optim: paged_adamw_8bit
fp16: true
bf16: false
gradient_checkpointing: true
logging_steps: 2
eval_steps: 4
save_steps: 4
save_total_limit: 1
report_to: none
